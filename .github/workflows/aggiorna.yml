name: Aggiorna dati

on:
  schedule:
    - cron: '15 4-20/2 * * *'
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scarica e controlla
        run: npm run scarica

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dati-grezzi
          path: |
            dati/*.json
            storico/*.json
          if-no-files-found: error
          retention-days: 1

  firma:
    needs: scarica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dati-grezzi
          path: arrivo

      - name: Copia i dati attesi
        run: |
          set -eu
          for name in transport events places alerts manifest; do
            test -f "arrivo/dati/$name.json"
            cp "arrivo/dati/$name.json" "dati/$name.json"
          done
          mkdir -p storico
          if [ -d arrivo/storico ]; then
            find arrivo/storico -maxdepth 1 -type f -regextype posix-extended \
              -regex '.*/[a-z]+-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json' -exec cp {} storico/ \;
          fi
          rm -rf arrivo

      - name: Controlla
        run: node scripts/check-data.mjs
        env:
          ASPITT_DATA_DIR: dati

      - name: Firma
        run: node scripts/firma-dati.mjs dati
        env:
          ASPITT_DATA_DIR: dati
          ASPITT_FIRMA_CHIAVE: ${{ secrets.ASPITT_FIRMA_CHIAVE }}

      - name: Pubblica i dati cambiati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "aspitt-dati"
          git config user.email "aspitt-dati@users.noreply.github.com"
          git add dati storico
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Dati del $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
