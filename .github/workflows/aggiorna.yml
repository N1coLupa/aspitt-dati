# Aggiornamento dei dati di Muevt.
#
# Tre tentativi al giorno: dopo l'ultima corsa (22:15 UTC), all'alba e a meta'
# giornata. Se una fonte non risponde, run-daily tiene i dati del giorno prima
# e aggiorna le altre; i file cambiati vengono pubblicati subito sul ramo
# principale, da cui l'app li scarica.
#
# Due lavori separati, su due macchine diverse:
#   1. "scarica" legge i siti esterni (PDF, pagine, API) senza chiave di firma
#      e senza poter scrivere nel repository;
#   2. "firma" riceve solo i file JSON, li controlla, li firma e li pubblica.
# Cosi' un PDF o una pagina costruiti per sfruttare un difetto di una libreria
# non possono arrivare alla chiave privata ne' al permesso di scrittura.

name: Aggiorna dati

on:
  schedule:
    - cron: '15 22 * * *'
    - cron: '30 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Niente script di installazione delle dipendenze: meno rischi dalla catena di fornitura.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scarica e controlla
        run: npm run scarica

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dati-grezzi
          path: |
            dati/*.json
            storico/*.json
          if-no-files-found: error
          retention-days: 1

  firma:
    needs: scarica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dati-grezzi
          path: arrivo

      # Dal primo lavoro si prendono solo file di dati con nomi attesi: niente
      # script, niente altri percorsi. Nessuna dipendenza npm qui: firma e
      # controllo usano solo i moduli di Node.
      - name: Copia i dati attesi
        run: |
          set -eu
          for name in transport events places alerts manifest; do
            test -f "arrivo/dati/$name.json"
            cp "arrivo/dati/$name.json" "dati/$name.json"
          done
          mkdir -p storico
          if [ -d arrivo/storico ]; then
            find arrivo/storico -maxdepth 1 -type f -regextype posix-extended \
              -regex '.*/[a-z]+-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json' -exec cp {} storico/ \;
          fi
          rm -rf arrivo

      - name: Controlla e firma
        run: node scripts/check-data.mjs && node scripts/firma-dati.mjs dati
        env:
          MUEVT_DATA_DIR: dati
          MUEVT_FIRMA_CHIAVE: ${{ secrets.MUEVT_FIRMA_CHIAVE }}

      - name: Pubblica i dati cambiati
        run: |
          git config user.name "muevt-dati"
          git config user.email "muevt-dati@users.noreply.github.com"
          git add dati storico
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Dati del $(date -u +%Y-%m-%d)"
            git push
          fi
