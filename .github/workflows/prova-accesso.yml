name: Prova accesso al sito

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Prova
        run: |
          set +e
          node scripts/prova-accesso.mjs | tee esito.txt
          {
            echo '```'
            cat esito.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
